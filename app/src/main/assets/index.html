<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>المزرعة السعيدة</title>
<style>
  :root{
    --bg:#12180F; --panel:#1C2417; --panel2:#232D1C; --line:#3A4A2C;
    --text:#F3F6EA; --muted:#B8C4A6; --accent:#8FD14F; --gold:#F2C94C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Noto Naskh Arabic','Amiri','Segoe UI',Tahoma,sans-serif;
    font-size:20px;line-height:1.7}
  body{padding:0 0 40px}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  header{padding:14px 16px 8px;border-bottom:2px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:26px;color:var(--accent)}
  #hdr-line{margin:4px 0 0;color:var(--muted);font-size:18px}
  main{padding:14px 14px 30px;max-width:760px;margin:0 auto}
  h2{font-size:24px;margin:6px 0 14px;color:var(--gold)}
  h2:focus{outline:3px solid var(--accent);outline-offset:6px;border-radius:8px}
  h3{font-size:21px;margin:18px 0 8px;color:var(--accent)}
  p{margin:0 0 12px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:16px;
    padding:14px;margin:0 0 14px}
  .big{font-size:22px;color:var(--text)}
  .muted{color:var(--muted);font-size:18px}
  button{
    display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;
    border:2px solid var(--line);background:var(--panel2);color:var(--text);
    font-family:inherit;font-size:21px;line-height:1.4;text-align:right;
  }
  button:focus{outline:4px solid var(--accent);outline-offset:3px}
  button:active{background:#2E3A23}
  button.primary{background:#2E4A22;border-color:var(--accent);color:#F6FFE9}
  button.back{background:transparent;border-color:var(--line);color:var(--muted);
    font-size:19px;padding:12px}
  .row{display:flex;gap:10px}
  .row button{flex:1;text-align:center}
  label{display:block;margin:14px 0 6px;font-size:19px;color:var(--muted)}
  input,select{width:100%;padding:14px;font-size:20px;border-radius:12px;
    border:2px solid var(--line);background:var(--panel2);color:var(--text);
    font-family:inherit}
  input:focus,select:focus{outline:4px solid var(--accent);outline-offset:2px}
  .toast{position:fixed;right:10px;left:10px;bottom:14px;background:#2E4A22;
    border:3px solid var(--accent);border-radius:14px;padding:12px 16px;
    font-size:19px;display:none;z-index:9}
  .toast.show{display:block}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .pill{display:inline-block;padding:2px 10px;border:1px solid var(--line);
    border-radius:20px;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>المزرعة السعيدة</h1>
  <p id="hdr-line">جارٍ التحميل…</p>
  <button id="read-screen-btn" data-act="read-screen" data-key="read-screen">اقرأ الشاشة</button>
</header>

<main id="screen" tabindex="-1"></main>

<div id="announcer" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="alert" class="sr" aria-live="assertive" aria-atomic="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================
   المزرعة السعيدة — لعبة نصية كاملة تعمل مع قارئ الشاشة
   ========================================================== */

/* ---------------- الصوت ----------------
   تسجيلات حقيقية لمزرعة (مكتبة Mixkit المجانية، بلا حقوق إلزامية):
   نقرة، عملات، شرب ماء، حصاد، ديك، بقرة، دجاج، عجلة، وهمهمة المزرعة. */
var SFX_FILES = {
  click:'sfx/click.mp3', coin:'sfx/coin.mp3', buy:'sfx/buy.mp3',
  success:'sfx/success.mp3', error:'sfx/error.mp3', harvest:'sfx/harvest.mp3',
  water:'sfx/water.mp3', wheel:'sfx/wheel.mp3', morning:'sfx/morning.mp3',
  feed:'sfx/feed.mp3', collect:'sfx/collect.mp3'
};
var SFX_VOL = {
  click:0.45, coin:0.70, buy:0.65, success:0.65, error:0.55,
  harvest:0.60, water:0.70, wheel:0.55, morning:0.65, feed:0.60, collect:0.65
};
var SFX_POOL = {};
function sfxPlayer(name){
  if(SFX_POOL[name]) return SFX_POOL[name];
  var src = SFX_FILES[name]; if(!src) return null;
  var a = new Audio(src);
  a.preload = 'auto';
  a.volume = SFX_VOL[name] || 0.6;
  SFX_POOL[name] = a;
  return a;
}
function playSfx(name){
  if(!S.sound) return;
  var a = sfxPlayer(name); if(!a) return;
  try{
    a.currentTime = 0;
    var p = a.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}
var SFX = {};
Object.keys(SFX_FILES).forEach(function(k){
  SFX[k] = function(){ playSfx(k); };
});

/* خلفية المزرعة وهي حية: أصوات دجاج وبهائم وطيور في حلقة هادئة */
var amb = null, ambTimer = null, ambFade = null, ambWanted = false;
function ambPlayer(){
  if(amb) return amb;
  amb = new Audio('sfx/ambience.mp3');
  amb.loop = true;
  amb.preload = 'auto';
  amb.volume = 0;
  return amb;
}
function musicStart(){
  ambWanted = true;
  if(ambFade){ clearInterval(ambFade); ambFade = null; }
  var a = ambPlayer();
  try{
    var p = a.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){ return; }
  if(ambTimer) return;
  ambTimer = setInterval(function(){
    if(!ambWanted){ clearInterval(ambTimer); ambTimer = null; return; }
    amb.volume = Math.min(0.30, amb.volume + 0.03);
    if(amb.volume >= 0.30){ clearInterval(ambTimer); ambTimer = null; }
  }, 120);
}
function musicStop(){
  ambWanted = false;
  if(ambTimer){ clearInterval(ambTimer); ambTimer = null; }
  if(!amb || ambFade) return;
  ambFade = setInterval(function(){
    amb.volume = Math.max(0, amb.volume - 0.05);
    if(amb.volume <= 0.001){
      clearInterval(ambFade); ambFade = null;
      try{ amb.pause(); amb.currentTime = 0; }catch(e){}
    }
  }, 80);
}
/* أول لمسة للشاشة تفتح سماح التشغيل التلقائي إن كان مغلقًا */
document.addEventListener('pointerdown', function unlockAudio(){
  document.removeEventListener('pointerdown', unlockAudio);
  if(ambWanted && amb && amb.paused) musicStart();
}, { once:true });

/* ---------------- النطق ---------------- */
function speakOut(text){
  if(!text || !S.tts) return;
  try{ if(window.Native && Native.speak){ Native.speak(text); return; } }catch(e){}
  try{
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar';
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
var toastTimer = null;
function showToast(text){
  var t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 4500);
}
function announce(text, assertive){
  var box = document.getElementById(assertive ? 'alert' : 'announcer');
  box.textContent = '';
  setTimeout(function(){ box.textContent = text; }, 60);
  speakOut(text);
  showToast(text);
}

/* ---------------- قراءة الشاشة ---------------- */
function bodyText(el){
  return (el && el.textContent ? el.textContent : '').replace(/\s+/g, ' ').trim();
}
function screenSummary(){
  var parts = [];
  var t = bodyText(screenEl ? screenEl.querySelector('h2') : null);
  if(t) parts.push(t);
  var hdr = bodyText(document.getElementById('hdr-line'));
  if(hdr) parts.push(hdr);
  var n = screenEl ? screenEl.querySelectorAll('button').length : 0;
  parts.push('في الشاشة ' + n + ' أزرار. اضغط زرار اقرأ الشاشة في الأعلى لسماع كل المكتوب.');
  return parts.join('. ');
}
function screenFullText(){
  var parts = [];
  var last = '';
  var t = bodyText(screenEl.querySelector('h2'));
  if(t){ parts.push(t); last = t; }
  var hdr = bodyText(document.getElementById('hdr-line'));
  if(hdr && hdr !== last){ parts.push(hdr); last = hdr; }
  var nodes = screenEl.querySelectorAll('h2, h3, p, button, li, span');
  for(var i = 0; i < nodes.length; i++){
    var s = bodyText(nodes[i]);
    if(!s || s === last) continue;
    last = s;
    parts.push(s);
  }
  return parts.join('. ');
}
function readScreen(){
  var text = screenFullText();
  if(!text){ announce('الشاشة فاضية.'); return; }
  if(!S.tts){
    try{ if(window.Native && Native.speak){ Native.speak(text); return; } }catch(e){}
  }
  announce(text);
}

/* ---------------- الأصوات ---------------- */
var VOICES = [];
function voiceLabel(){
  try{
    if(window.Native && Native.voiceInfo){
      var o = JSON.parse(Native.voiceInfo() || '{}');
      if(o && o.locale){
        return (o.network ? 'صوت شبكة يحتاج إنترنت: ' : 'صوت محلي: ') + o.locale;
      }
    }
  }catch(e){}
  return 'صوت الهاتف الافتراضي';
}
function loadVoices(){
  VOICES = [];
  try{
    if(window.Native && Native.listArabicVoices){
      var raw = JSON.parse(Native.listArabicVoices() || '[]');
      for(var i = 0; i < raw.length; i++){
        var v = raw[i];
        VOICES.push({
          name: v.name,
          label: (v.network ? 'شبكة' : 'محلي') + ' — ' + v.locale + ' — ' + v.name
        });
      }
    }
  }catch(e){ VOICES = []; }
}
function doTestVoice(){
  try{ if(window.Native && Native.testVoice){ Native.testVoice(); return; } }catch(e){}
  announce('اختبار الصوت: المزرعة السعيدة تعمل بالكلام.');
}
function doPickVoice(i){
  var v = VOICES[i];
  if(!v){ announce('هذا الصوت غير متاح.', true); return; }
  var ok = false;
  try{ if(window.Native && Native.setVoice) ok = Native.setVoice(v.name); }catch(e){}
  go('settings');
  announce(ok ? 'تم اختيار الصوت: ' + v.label + '. استمع للصوت الجديد.' : 'تعذر اختيار هذا الصوت على هاتفك.', !ok);
  if(ok){ setTimeout(doTestVoice, 900); }
}

function sellPrice(k){
  if(GOODS[k] && GOODS[k].sell) return GOODS[k].sell;
  if(k.indexOf('crop:') === 0){
    var sd = SEEDS.filter(function(s){ return 'crop:'+s[0] === k; })[0];
    return sd ? Math.round(sd[2] * 3.5) : 10;
  }
  if(k.indexOf('a:') === 0){
    var an = ANIMALS.filter(function(a){ return 'a:'+a[0] === k; })[0];
    return an ? Math.max(4, an[2] * 4) : 8;
  }
  if(k.indexOf('sup:') === 0){
    var sp = SUPPLIES.filter(function(s){ return 'sup:'+s[0] === k; })[0];
    return sp ? Math.max(1, Math.floor(sp[2] / 2)) : 1;
  }
  if(k.indexOf('seed:') === 0){
    var se = SEEDS.filter(function(s){ return 'seed:'+s[0] === k; })[0];
    return se ? Math.max(1, Math.floor(se[2] / 2)) : 1;
  }
  return 5;
}

/* ---------------- الحالة ---------------- */
var KEY = 'waad.happyfarm.v1';
var S = null;

/* هل قارئ الشاشة يعمل على الهاتف؟ حينها نترك الكلام له حتى لا يتكلم صوتان معًا */
function srPresent(){
  try{ return !!(window.Native && Native.hasScreenReader && Native.hasScreenReader()); }catch(e){ return false; }
}

function fresh(){
  var plots = [];
  for(var i=0;i<6;i++) plots.push({crop:null, readyAt:0, watered:false});
  return {
    coins: 1500,
    day: 1,
    inv: {'seed:cotton':2, 'seed:tomato':2, 'sup:thread_thin':2, 'sup:beads_white':1},
    animals: {'hen':2, 'cow':1},
    pending: {},
    plots: plots,
    barnCap: 100,
    garden: {readyAt: Date.now() + 180000},
    orchard: {readyAt: Date.now() + 240000},
    fed: false,
    shops: [],
    wheelDay: 0,
    quizDay: 0,
    quizLeft: 3,
    sound: true,
    music: false,
    tts: !srPresent(),
    lastProduce: Date.now()
  };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var st = JSON.parse(raw); if(st && st.plots && st.inv) return st; }
  }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

S = load();

function addItem(k,n){ S.inv[k] = (S.inv[k] || 0) + n; }
function takeItem(k,n){
  if((S.inv[k] || 0) < n) return false;
  S.inv[k] -= n;
  if(S.inv[k] <= 0) delete S.inv[k];
  return true;
}
function have(k){ return S.inv[k] || 0; }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function animalCount(){
  var t = 0;
  for(var k in S.animals) t += S.animals[k];
  return t;
}
function humanMs(ms){
  if(ms <= 0) return 'جاهز';
  var s = Math.ceil(ms / 1000);
  if(s < 60) return s + ' ثانية';
  var m = Math.floor(s / 60), r = s % 60;
  return m + ' دقيقة' + (r ? ' و' + r + ' ثانية' : '');
}
function goodsList(filterFn){
  return Object.keys(S.inv).filter(function(k){ return S.inv[k] > 0 && (!filterFn || filterFn(k)); })
    .sort(function(a,b){ return gname(a).localeCompare(gname(b), 'ar'); });
}

/* ---------------- التحديث الدوري ---------------- */
function tick(){
  var now = Date.now();
  if(now >= S.garden.readyAt){
    var flowers = SEEDS.filter(function(s){ return ['rose','jasmine','tulip','sunflower','chrysanthemum','lavender'].indexOf(s[0]) >= 0; });
    var f = flowers[Math.floor(Math.random()*flowers.length)];
    addItem('crop:'+f[0], 2);
    S.garden.readyAt = now + 180000;
    save();
  }
  if(now >= S.orchard.readyAt){
    var fruits = SEEDS.filter(function(s){ return ['orange','lemon','mango','banana','grapes','apple','pomegranate','strawberry'].indexOf(s[0]) >= 0; });
    var fr = fruits[Math.floor(Math.random()*fruits.length)];
    addItem('crop:'+fr[0], 2);
    S.orchard.readyAt = now + 240000;
    save();
  }
  updateHeader();
}

/* ---------------- الواجهة ---------------- */
var view = 'home';
var lastKey = '';
var screenEl = document.getElementById('screen');

function updateHeader(){
  var ready = S.plots.filter(function(p){ return p.crop && Date.now() >= p.readyAt; }).length;
  document.getElementById('hdr-line').textContent =
    'العملات: ' + fmt(S.coins) + ' • اليوم: ' + S.day +
    ' • الحيوانات: ' + animalCount() + ' من ' + S.barnCap +
    ' • محاصيل جاهزة: ' + ready;
}

function render(){
  var fn = SCREENS[view] || SCREENS.home;
  screenEl.innerHTML = fn();
  updateHeader();
  var h = screenEl.querySelector('h2');
  if(h) h.focus();
}

function rerender(msg, key){
  var k = key || lastKey;
  var fn = SCREENS[view] || SCREENS.home;
  screenEl.innerHTML = fn();
  updateHeader();
  if(k){
    var b = screenEl.querySelector('[data-key="' + k + '"]');
    if(b) b.focus();
  }
  if(msg) announce(msg);
  save();
}

function go(name){
  view = name;
  render();
  window.scrollTo(0,0);
  announce(screenSummary());
}

function backBtn(){
  return '<button class="back" data-act="go" data-screen="home" data-key="back">رجوع إلى القائمة الرئيسية</button>';
}
function title(t){
  return '<h2 tabindex="-1" data-key="title">' + t + '</h2>';
}

    html += '<p class="big">أجبت على أسئلة اليوم. عد غدًا بعد بدء يوم جديد.</p>';
  }else{
    var q = QUIZ[idx];
    html += '<div class="card"><p class="big">السؤال رقم ' + (idx+1) + ' من ثلاثة</p>' +
      '<p class="big">' + q.q + '</p></div>';
    q.o.forEach(function(opt, i){
      html += '<button data-act="quiz-answer" data-i="' + i + '" data-key="qa-' + i + '">' + opt + '</button>';
    });
    html += '<p class="muted">بقي لك ' + S.quizLeft + ' أسئلة اليوم.</p>';
  }
  html += backBtn();
  return html;
};

/* ---------------- الأفعال ---------------- */
function feedCost(){ return animalCount() * 2; }

function doWaterAll(){
  var n = 0;
  S.plots.forEach(function(p){
    if(p.crop && !p.watered && Date.now() < p.readyAt){
      p.watered = true;
      p.readyAt = Date.now() + Math.max(1000, (p.readyAt - Date.now()) * 0.8);
      n++;
    }
  });
  if(n){ SFX.water(); rerender('رويت ' + n + ' قطعة زرع، وسرّعت نموها.', 'w'); }
  else { SFX.error(); announce('لا توجد مزروعات تحتاج ريًا الآن.', true); }
}

function doHarvestAll(){
  var n = 0, total = 0;
  S.plots.forEach(function(p){
    if(p.crop && Date.now() >= p.readyAt){
      var sd = SEEDS.filter(function(s){ return s[0] === p.crop; })[0];
      if(sd){ addItem('crop:'+sd[0], sd[4]); total += sd[4]; }
      p.crop = null; p.readyAt = 0; p.watered = false;
      n++;
    }
  });
  if(n){ SFX.harvest(); rerender('حصت ' + n + ' قطعة، وأضفت ' + total + ' وحدة إلى المخزون.', 'h'); }
  else { SFX.error(); announce('لا يوجد محصول جاهز للحصاد الآن.', true); }
}

function doFeedAll(){
  if(animalCount() === 0){ SFX.error(); announce('لا توجد حيوانات في الحظيرة.', true); return; }
  if(S.fed){ announce('الحيوانات أكلت اليوم بالفعل وتنتج الآن.', false); return; }
  var cost = feedCost();
  if(S.coins < cost){ SFX.error(); announce('تحتاج ' + fmt(cost) + ' عملة لإطعام كل الحيوانات. رصيدك ' + fmt(S.coins) + '.', true); return; }
  S.coins -= cost;
  S.fed = true;
  S.lastProduce = Date.now();
  SFX.feed();
  rerender('أطعمت كل الحيوانات مقابل ' + fmt(cost) + ' عملة. ستبدأ الإنتاج الآن.', 'f');
}

function collectAnimal(id){
  var pend = S.pending[id] || 0;
  if(pend <= 0) return 0;
  addItem('a:'+id, pend);
  S.pending[id] = 0;
  return pend;
}
function doCollectAll(){
  var total = 0;
  Object.keys(S.pending).forEach(function(id){ total += collectAnimal(id); });
  if(total){ SFX.collect(); rerender('جمعت ' + total + ' منتجًا من الحيوانات إلى المخزون.', 'c'); }
  else { SFX.error(); announce('لا توجد منتجات جاهزة. تأكد أن الحيوانات أكلت وانتظر قليلًا.', true); }
}

function doNewDay(){
  S.day += 1;
  S.coins += 1000;
  SUPPLIES.forEach(function(s){ addItem('sup:'+s[0], 3); });
  SEEDS.forEach(function(s){ addItem('seed:'+s[0], 3); });
  ANIMALS.forEach(function(a){ addItem('a:'+a[0], 3); });
  SEEDS.forEach(function(s){ addItem('crop:'+s[0], 3); });
  S.fed = false;
  S.quizDay = S.day; S.quizLeft = 3;
  S.wheelDay = 0;
  S.pending = {};
  S.lastProduce = Date.now();
  if(S.shops.length) S.coins += S.shops.length * 200;
  SFX.morning();
  save();
  rerender('بدأ اليوم رقم ' + S.day + '. أضفت ألف عملة وثلاث وحدات من كل بذرة ومستلزم وحيوان ومحصول.' +
    (S.shops.length ? ' ومحلاتك أعطتك ' + fmt(S.shops.length*200) + ' عملة.' : ''), 'newday');
}

function doBuyAnimal(id){
  var a = ANIMALS.filter(function(x){ return x[0] === id; })[0];
  if(!a) return;
  if(animalCount() >= S.barnCap){ SFX.error(); announce('الحظيرة ممتلئة. وسّعها أولًا.', true); return; }
  if(S.coins < a[2]){ SFX.error(); announce('رصيدك لا يكفي. سعر ' + a[1] + ' هو ' + fmt(a[2]) + ' عملة.', true); return; }
  S.coins -= a[2];
  S.animals[id] = (S.animals[id] || 0) + 1;
  SFX.buy();
  rerender('اشتريت ' + a[1] + '. عندك الآن ' + S.animals[id] + '. رصيدك ' + fmt(S.coins) + ' عملة.', 'ba-'+id);
}

function doBuySeed(id, qty){
  var s = SEEDS.filter(function(x){ return x[0] === id; })[0];
  if(!s) return;
  var price = qty === 10 ? Math.round(s[2] * 9) : s[2];
  if(S.coins < price){ SFX.error(); announce('رصيدك لا يكفي. السعر ' + fmt(price) + ' عملة.', true); return; }
  S.coins -= price;
  addItem('seed:'+id, qty);
  SFX.buy();
  rerender('اشتريت ' + qty + ' من ' + s[1] + ' مقابل ' + fmt(price) + ' عملة.', 'bs'+(qty===10?'10':'1')+'-'+id);
}

function doBuySupply(id){
  var s = SUPPLIES.filter(function(x){ return x[0] === id; })[0];
  if(!s) return;
  if(S.coins < s[2]){ SFX.error(); announce('رصيدك لا يكفي. السعر ' + fmt(s[2]) + ' عملة.', true); return; }
  S.coins -= s[2];
  addItem('sup:'+id, 1);
  SFX.buy();
  rerender('اشتريت ' + s[1] + '. عندك الآن ' + have('sup:'+id) + '.', 'bsp-'+id);
}

function doBuyPlot(){
  var price = 700 + (S.plots.length - 6) * 300;
  if(S.plots.length >= 15){ SFX.error(); announce('وصلت إلى أقصى عدد قطع الأرض.', true); return; }
  if(S.coins < price){ SFX.error(); announce('تحتاج ' + fmt(price) + ' عملة لشراء قطعة أرض.', true); return; }
  S.coins -= price;
  S.plots.push({crop:null, readyAt:0, watered:false});
  SFX.buy();
  rerender('اشتريت قطعة أرض جديدة. عندك الآن ' + S.plots.length + ' قطعة.', 'buyplot');
}

function doPlant(id, all){
  var sd = SEEDS.filter(function(x){ return x[0] === id; })[0];
  if(!sd) return;
  var planted = 0, empty = 0;
  S.plots.forEach(function(p){ if(!p.crop) empty++; });
  if(empty === 0){ SFX.error(); announce('كل الأرض مزروعة. احصد أولًا.', true); return; }
  var limit = all ? Math.min(empty, have('seed:'+id)) : Math.min(1, have('seed:'+id));
  if(limit <= 0){ SFX.error(); announce('لا توجد بذور من هذا النوع.', true); return; }
  for(var i=0;i<S.plots.length && planted<limit;i++){
    var p = S.plots[i];
    if(p.crop) continue;
    if(!takeItem('seed:'+id, 1)) break;
    p.crop = id;
    p.readyAt = Date.now() + sd[3]*1000;
    p.watered = false;
    planted++;
  }
  SFX.harvest();
  rerender('زرعت ' + planted + ' من ' + sd[1] + '. ستنمو في ' + humanMs(sd[3]*1000) + '.', all ? 'pa-'+id : 'p1-'+id);
}

function doPlotWater(i){
  var p = S.plots[i];
  if(!p || !p.crop) return;
  if(p.watered){ SFX.error(); announce('هذه القطعة مروية بالفعل.', true); return; }
  p.watered = true;
  p.readyAt = Date.now() + Math.max(1000, (p.readyAt - Date.now()) * 0.8);
  SFX.water();
  rerender('رويت القطعة رقم ' + (i+1) + '. يتبقى ' + humanMs(p.readyAt-Date.now()) + '.', 'pw-'+i);
}

function doPlotHarvest(i){
  var p = S.plots[i];
  if(!p || !p.crop) return;
  if(Date.now() < p.readyAt){ SFX.error(); announce('المحصول لم ينضج بعد. يتبقى ' + humanMs(p.readyAt-Date.now()) + '.', true); return; }
  var sd = SEEDS.filter(function(s){ return s[0] === p.crop; })[0];
  var qty = sd ? sd[4] : 1;
  addItem('crop:'+p.crop, qty);
  p.crop = null; p.readyAt = 0; p.watered = false;
  SFX.harvest();
  rerender('حصت القطعة رقم ' + (i+1) + ' وأضفت ' + qty + ' ' + (sd ? sd[5] : 'وحدة') + ' إلى المخزون.', 'ph-'+i);
}

function doWheel(){
  if(S.wheelDay === S.day){ SFX.error(); announce('جربت حظك اليوم بالفعل. عد بعد يوم جديد.', true); return; }
  S.wheelDay = S.day;
  S.coins += 500000000;
  SFX.wheel();
  setTimeout(function(){ SFX.coin(); }, 600);
  save();
  rerender('مليون مبروك! العجلة أعطتك خمسمئة مليون عملة. رصيدك الآن ' + fmt(S.coins) + '.', 'spin');
}

function doQuiz(i){
  if(S.quizLeft <= 0) return;
  var idx = 3 - S.quizLeft;
  var q = QUIZ[idx];
  if(i === q.a){
    S.coins += 1000000;
    S.quizLeft -= 1;
    SFX.coin();
    save();
    if(S.quizLeft <= 0){
      rerender('إجابة صحيحة! أضفت مليون عملة. أكملت أسئلة اليوم. رصيدك ' + fmt(S.coins) + '.', 'qa-'+i);
    }else{
      rerender('إجابة صحيحة! أضفت مليون عملة. رصيدك ' + fmt(S.coins) + '. السؤال التالي.', 'qa-'+i);
    }
  }else{
    SFX.error();
    announce('إجابة غير صحيحة. الإجابة الصحيحة هي: ' + q.o[q.a] + '.', true);
  }
}

function doCraft(id){
  var r = FACTORY_RECIPES.filter(function(x){ return x[0] === id; })[0];
  if(!r) return;
  for(var k in r[2]) if(have(k) < r[2][k]){ SFX.error(); announce('المكوّنات غير كافية لصنع ' + r[1] + '.', true); return; }
  for(var k2 in r[2]) takeItem(k2, r[2][k2]);
  for(var o in r[3]) addItem(o, r[3][o]);
  SFX.success();
  rerender('صنعت ' + r[1] + '. ستجده في السوق للبيع.', 'cr-'+id);
}

function doCook(id){
  var r = RESTAURANT_RECIPES.filter(function(x){ return x[0] === id; })[0];
  if(!r) return;
  for(var k in r[2]) if(have(k) < r[2][k]){ SFX.error(); announce('المكوّنات غير كافية لطبخ ' + r[1] + '.', true); return; }
  for(var k2 in r[2]) takeItem(k2, r[2][k2]);
  for(var o in r[3]) addItem(o, r[3][o]);
  SFX.success();
  rerender('طبخت ' + r[1] + '. ستجده في السوق للبيع.', 'ck-'+id);
}

function doSell(key, qty){
  var n = have(key);
  if(n <= 0){ SFX.error(); announce('لا يوجد من هذا المنتج في المخزون.', true); return; }
  var sellN = qty === 'all' ? n : Math.min(n, parseInt(qty, 10));
  if(sellN <= 0) return;
  var total = sellN * sellPrice(key);
  takeItem(key, sellN);
  S.coins += total;
  SFX.coin();
  save();
  rerender('بعت ' + sellN + ' من ' + gname(key) + ' مقابل ' + fmt(total) + ' عملة. رصيدك ' + fmt(S.coins) + '.', key);
}

function doExpandBarn(){
  if(S.barnCap >= 111){ SFX.error(); announce('الحظيرة وصلت إلى أقصى سعة أحد عشر ومئة.', true); return; }
  if(S.coins < 2000){ SFX.error(); announce('تحتاج ألفي عملة لتوسيع الحظيرة.', true); return; }
  S.coins -= 2000;
  S.barnCap = Math.min(111, S.barnCap + 11);
  SFX.buy();
  rerender('وسعت الحظيرة. السعة الآن ' + S.barnCap + ' حيوان.', 'expand');
}

function doBarnCollect(id){
  var n = collectAnimal(id);
  if(n > 0){ SFX.collect(); rerender('جمعت ' + n + ' منتجًا.', 'bc-'+id); }
  else { SFX.error(); announce('لا توجد منتجات جاهزة لهذا الحيوان.', true); }
}

function doBarnSell(id){
  var a = ANIMALS.filter(function(x){ return x[0] === id; })[0];
  var n = (S.pending[id] || 0) + have('a:'+id);
  if(n <= 0){ SFX.error(); announce('لا يوجد منتج لبيعه.', true); return; }
  var unit = sellPrice('a:'+id);
  var max = Math.min(n, Math.floor(2000 / unit) || 1);
  var total = max * unit;
  var fromPending = Math.min(S.pending[id] || 0, max);
  S.pending[id] = (S.pending[id] || 0) - fromPending;
  takeItem('a:'+id, max - fromPending);
  S.coins += total;
  SFX.coin();
  rerender('بعت ' + max + ' من ' + a[3] + ' مقابل ' + fmt(total) + ' عملة. رصيدك ' + fmt(S.coins) + '.', 'bs-'+id);
}

function doBarnFood(id){
  var a = ANIMALS.filter(function(x){ return x[0] === id; })[0];
  var n = (S.pending[id] || 0) + have('a:'+id);
  if(n < 3){ SFX.error(); announce('تحتاج ثلاثة منتجات على الأقل لإعداد وجبة.', true); return; }
  var fromPending = Math.min(S.pending[id] || 0, 3);
  S.pending[id] = (S.pending[id] || 0) - fromPending;
  takeItem('a:'+id, 3 - fromPending);
  addItem('d:'+id, 1);
  GOODS['d:'+id] = {name:'وجبة ' + a[1], sell: sellPrice('a:'+id) * 3};
  SFX.success();
  rerender('أعددت وجبة من ' + a[1] + '. قيمتها أعلى، وستجدها في السوق.', 'bf-'+id);
}

function doCreateShop(){
  var nameEl = document.getElementById('shop-name');
  var catEl = document.getElementById('shop-cat');
  var name = (nameEl && nameEl.value || '').trim();
  var cat = catEl ? catEl.value : 'إكسسوارات';
  if(!name){ SFX.error(); announce('اكتب اسم المحل أولًا.', true); return; }
  S.shops.push({name:name, cat:cat});
  SFX.success();
  save();
  view = 'shops';
  render();
  announce('تم إنشاء محل ' + name + ' في قسم ' + cat + '. سيعطيك مئتي عملة كل يوم جديد.');
}

function doToggle(which){
  if(which === 'sound'){ S.sound = !S.sound; SFX.click(); }
  if(which === 'music'){
    S.music = !S.music;
    if(S.music) musicStart(); else musicStop();
  }
  if(which === 'tts'){
    S.tts = !S.tts;
    if(!S.tts){ try{ if(window.Native && Native.stopSpeaking) Native.stopSpeaking(); }catch(e){}
      try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
  }
  save();
  var msg = which === 'sound' ? ('المؤثرات الصوتية ' + (S.sound ? 'مفعلة' : 'مغلقة') + '.')
          : which === 'music' ? ('أصوات المزرعة في الخلفية ' + (S.music ? 'مفعلة' : 'مغلقة') + '.')
          : ('النطق التلقائي ' + (S.tts ? 'مفعل' : 'مغلق') + '.');
  rerender(msg, which === 'sound' ? 'tsound' : which === 'music' ? 'tmusic' : 'ttts');
}

var resetArmed = false;
function doReset(){
  if(!resetArmed){
    resetArmed = true;
    setTimeout(function(){ resetArmed = false; }, 8000);
    announce('تحذير: هذا يمسح كل تقدمك. اضغط الزر مرة أخرى خلال ثماني ثوان للتأكيد.', true);
    return;
  }
  resetArmed = false;
  S = fresh();
  save();
  view = 'home';
  render();
  SFX.morning();
  announce('بدأت اللعبة من جديد. رصيدك ألف وخمسمئة عملة.');
}

function doExit(){
  try{
    if(window.Native && Native.finishApp){ Native.finishApp(); return; }
  }catch(e){}
  announce('للخروج، اضغط زر الرجوع في هاتفك.');
}

/* ---------------- الموجّه ---------------- */
function handle(act, d){
  switch(act){
    case 'go': go(d.screen); return;
    case 'water-all': doWaterAll(); return;
    case 'harvest-all': doHarvestAll(); return;
    case 'feed-all': doFeedAll(); return;
    case 'collect-all': doCollectAll(); return;
    case 'new-day': doNewDay(); return;
    case 'buy-animal': doBuyAnimal(d.id); return;
    case 'buy-seed': doBuySeed(d.id, parseInt(d.qty, 10)); return;
    case 'buy-supply': doBuySupply(d.id); return;
    case 'buy-plot': doBuyPlot(); return;
    case 'plant-one': doPlant(d.id, false); return;
    case 'plant-all': doPlant(d.id, true); return;
    case 'plot-water': doPlotWater(parseInt(d.i, 10)); return;
    case 'plot-harvest': doPlotHarvest(parseInt(d.i, 10)); return;
    case 'plot-empty': announce('هذه القطعة فارغة. اختر بذرة من قسم ازرع من بذورك بالأسفل.'); return;
    case 'expand-barn': doExpandBarn(); return;
    case 'barn-collect': doBarnCollect(d.id); return;
    case 'barn-sell': doBarnSell(d.id); return;
    case 'barn-food': doBarnFood(d.id); return;
    case 'craft': doCraft(d.id); return;
    case 'cook': doCook(d.id); return;
    case 'sell': doSell(d.key, d.qty); return;
    case 'create-shop': doCreateShop(); return;
    case 'wheel-spin': doWheel(); return;
    case 'quiz-answer': doQuiz(parseInt(d.i, 10)); return;
    case 'toggle-sound': doToggle('sound'); return;
    case 'toggle-music': doToggle('music'); return;
    case 'toggle-tts': doToggle('tts'); return;
    case 'read-screen': readScreen(); return;
    case 'test-voice': doTestVoice(); return;
    case 'list-voices': loadVoices(); go('voices'); return;
    case 'pick-voice': doPickVoice(parseInt(d.i, 10)); return;
    case 'reset': doReset(); return;
    case 'exit': doExit(); return;
  }
}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!b) return;
  lastKey = b.getAttribute('data-key') || lastKey;
  SFX.click();
  handle(b.getAttribute('data-act'), b.dataset);
});

/* ---------------- الإنتاج الدوري للحيوانات ---------------- */
function produceTick(){
  if(S.fed){
    var now = Date.now();
    var elapsed = now - S.lastProduce;
    var cycles = Math.floor(elapsed / 60000);
    if(cycles > 0){
      Object.keys(S.animals).forEach(function(id){
        if(S.animals[id] > 0){
          S.pending[id] = Math.min(20, (S.pending[id] || 0) + S.animals[id] * cycles);
        }
      });
      S.lastProduce = now - (elapsed % 60000);
      save();
      if(view === 'barn') rerender('', lastKey);
    }
  }
}

/* ---------------- البدء ---------------- */
function boot(){
  if(S.music) musicStart();
  render();
  setInterval(tick, 5000);
  setInterval(produceTick, 15000);
  announce('مرحبًا بك في المزرعة السعيدة. لعبة كاملة بالكلام تعمل مع قارئ الشاشة. اضغط بدء يوم جديد للبدء.');
}
boot();
</script>
